services:
  transcribe-app:
    build: .
    container_name: handwriting-text-recognition-container
    restart: unless-stopped
    volumes:
      - .:/app
      - /home/marcel/Dokumente/Scans:/data
    # Allows the container to connect to host services like Ollama via host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"